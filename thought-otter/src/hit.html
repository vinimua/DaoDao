<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';">
  <style>
    * { margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: rgba(0,0,0,0.004);
    }
    #hit-area {
      width: 100%;
      height: 100%;
      cursor: grab;
      transition: background 0.15s;
    }
    #hit-area.dragging {
      cursor: grabbing;
    }
    #hit-area.drag-over {
      background: rgba(139, 115, 85, 0.25);
      cursor: copy;
    }
  </style>
</head>
<body>
  <div id="hit-area"></div>
  <script src="hit-renderer.js"></script>
</body>
</html>
