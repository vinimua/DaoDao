<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
    #otter-container {
      position: relative;
      width: 100%;
      height: 100%;
    }
    #otter-container::after {
      content: "";
      position: absolute;
      left: 24%;
      right: 24%;
      bottom: 6%;
      height: 10%;
      border-radius: 999px;
      background: radial-gradient(ellipse at center, rgba(20, 12, 6, 0.28), rgba(20, 12, 6, 0));
      pointer-events: none;
    }
    #jacob-stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 1;
      transition: opacity 0.25s ease, filter 0.3s ease;
    }
    #jacob-stage canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #otter-container[data-state="quiet"] #jacob-stage {
      opacity: 0.6;
      filter: brightness(0.7);
    }
    #otter-container[data-state="hidden"] #jacob-stage {
      opacity: 0;
    }
  </style>
</head>
<body>
  <div id="otter-container" data-state="idle">
    <div id="jacob-stage" aria-label="Jacob 3D pet"></div>
  </div>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/build/three.module.js",
        "three/addons/": "./vendor/three/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="renderer.js"></script>
</body>
</html>
