<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    }
    #bubble {
      display: none;
      max-width: 240px;
      padding: 8px 12px;
      background: rgba(28, 22, 14, 0.72);
      border: 1px solid rgba(200, 180, 140, 0.25);
      border-radius: 14px;
      color: #D4C4A8;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
      pointer-events: none;
    }
    #bubble.visible {
      display: block;
    }
    .item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 0;
      font-size: 12px;
      line-height: 1.4;
      border-bottom: 1px solid rgba(200, 180, 140, 0.12);
    }
    .item:last-child {
      border-bottom: none;
    }
    .item .time {
      color: rgba(200, 180, 150, 0.55);
      font-size: 10px;
      white-space: nowrap;
      min-width: 36px;
    }
    .item .content {
      color: rgba(240, 225, 200, 0.9);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      min-width: 0;
    }
  </style>
</head>
<body>
  <div id="bubble"></div>
  <script src="bubble.js"></script>
</body>
</html>
