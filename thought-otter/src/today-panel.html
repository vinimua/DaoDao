<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      user-select: none;
    }
    #panel {
      width: 100%;
      height: 100%;
      background: #201A14;
      border: 1px solid #5E4E3A;
      box-shadow: 0 8px 24px rgba(0,0,0,0.42);
      display: flex;
      flex-direction: column;
    }
    #header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid #3A3024;
      color: #D4C4A8;
      font-size: 14px;
      font-weight: bold;
      flex: none;
      -webkit-app-region: drag;
      cursor: grab;
    }
    #header:active { cursor: grabbing; }
    #header .count {
      font-weight: normal;
      color: #8A7A6A;
      font-size: 12px;
    }
    #list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 14px;
    }
    #list::-webkit-scrollbar {
      width: 4px;
    }
    #list::-webkit-scrollbar-thumb {
      background: #5E4E3A;
      border-radius: 2px;
    }
    #empty {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #8A7A6A;
      font-size: 13px;
    }
    .thought-item {
      padding: 8px 0;
      border-bottom: 1px solid #2E2418;
      cursor: pointer;
    }
    .thought-item:last-child {
      border-bottom: none;
    }
    .thought-item .meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .thought-item .time {
      color: #8A7A6A;
      font-size: 11px;
      min-width: 40px;
    }
    .thought-item .cat {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 3px;
      background: #3A3024;
      color: #A09070;
    }
    .thought-item .cat.todo { color: #F0C060; }
    .thought-item .cat.idea { color: #90D0F0; }
    .thought-item .cat.question { color: #F09090; }
    .thought-item .cat.note { color: #A09070; }
    .thought-item .source {
      font-size: 10px;
      color: #5E4E3A;
    }
    .thought-item .content {
      color: #D4C4A8;
      font-size: 13px;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .thought-item .content.expanded {
      -webkit-line-clamp: unset;
      display: block;
    }
    .thought-item .actions {
      display: none;
      gap: 6px;
      margin-top: 4px;
    }
    .thought-item.expanded .actions {
      display: flex;
    }
    .thought-item button {
      font-size: 11px;
      padding: 2px 10px;
      border: 1px solid #5E4E3A;
      background: transparent;
      color: #A09070;
      border-radius: 3px;
      cursor: pointer;
      font-family: inherit;
    }
    .thought-item button:hover {
      background: #3A3024;
      color: #D4C4A8;
    }
    .thought-item button.open-btn:hover {
      background: #2A3A30;
      color: #90D0A0;
      border-color: #4A6A50;
    }
    .thought-item button.danger:hover {
      background: #4A2020;
      color: #F09090;
      border-color: #803030;
    }
    .copied-flash {
      color: #90D090 !important;
      transition: color 0.3s;
    }
  </style>
</head>
<body>
  <div id="panel">
    <div id="header">
      <span>念头列表</span>
      <span class="count" id="count">加载中...</span>
    </div>
    <div id="list"></div>
  </div>
  <script src="today-panel.js"></script>
</body>
</html>
